    <script type="module">
        import React, { useState, useEffect, useRef } from 'react';
        import { createRoot } from 'react-dom/client';
        import {

            Heart, Zap, Home, RefreshCw, ChevronLeft, ChevronRight,

        // --- HELPER FUNCTIONS ---
        const generateId = () => Math.random().toString(36).substr(2, 9);
        const getIranDate = () => new Date(new Date().toLocaleString("en-US", { timeZone: "Asia/Tehran" }));

        // --- CONSTANTS ---
        const LEVEL_THRESHOLDS = [0, 500, 1200, 2500, 5000, 10000];

        // --- MAIN APP COMPONENT ---
        function LifeRPG() {
            // STATE

            });
            const [syncStatus, setSyncStatus] = useState('offline');

                    customEvents: [ { id: 'e1', title: 'شروع امتحانات', date: `${new Date().getFullYear() + 1}-01-05T09:00`, type: 'exam_start' }, { id: 'e2', title: 'پایان امتحانات', date: `${new Date().getFullYear() + 1}-01-15T12:00`, type: 'exam_end' } ]
                };
            });

            const [planStatus, setPlanStatus] = useState({ currentWeek: 1, currentMonth: 1, dayOfPlan: 1, countdownLabel: '', countdownText: '' });
            const [currentMonthView, setCurrentMonthView] = useState(1);
            
            // Temporary Inputs
            const [newQuestType, setNewQuestType] = useState('daily');
            const [newQuestData, setNewQuestData] = useState({ text: '', desc: '', xp: 50 });
            const [newEventData, setNewEventData] = useState({ title: '', date: '' });
            const [tempSyncConfig, setTempSyncConfig] = useState(syncConfig);

            // --- EFFECTS ---
            useEffect(() => { setLoading(false); }, []);
            
            useEffect(() => { localStorage.setItem('rpg_local_data', JSON.stringify(state)); }, [state]);

            useEffect(() => {
                let newLevel = 1;
                for (let i = 0; i < LEVEL_THRESHOLDS.length; i++) { if (state.xp >= LEVEL_THRESHOLDS[i]) newLevel = i + 1; }
                if (newLevel !== state.level) setState(prev => ({ ...prev, level: newLevel }));
            }, [state.xp]);

            // Sync Logic (Supabase)
            const syncWithCloud = async (direction = 'push') => {
                if (!syncConfig.url || !syncConfig.key) return;
                setSyncStatus('syncing');
                try {
                    const endpoint = `${syncConfig.url}/rest/v1/planners`;
                    const headers = { 'apikey': syncConfig.key, 'Authorization': `Bearer ${syncConfig.key}`, 'Content-Type': 'application/json', 'Prefer': 'return=minimal' };
                    if (direction === 'push') {
                        const payload = { id: userId, data: state };
                        const response = await fetch(`${endpoint}?on_conflict=id`, { method: 'POST', headers: { ...headers, 'Prefer': 'resolution=merge-duplicates' }, body: JSON.stringify(payload) });
                        if (!response.ok) throw new Error('Save failed');
                        setSyncStatus('success');
                    } else {
                        const response = await fetch(`${endpoint}?id=eq.${userId}&select=data`, { method: 'GET', headers });
                        if (!response.ok) throw new Error('Load failed');
                        const result = await response.json();
                        if (result && result.length > 0) { setState(result[0].data); setSyncStatus('success'); alert('دریافت شد!'); } 
                        else { setSyncStatus('error'); alert('اطلاعاتی یافت نشد.'); }
                    }
                } catch (err) { console.error(err); setSyncStatus('error'); }
                setTimeout(() => setSyncStatus(syncConfig.url ? 'idle' : 'offline'), 2000);
            };

            useEffect(() => {
                if (!syncConfig.url) return;
                const handler = setTimeout(() => syncWithCloud('push'), 3000);
                return () => clearTimeout(handler);
            }, [state, syncConfig]);

            // Clock Logic
            useEffect(() => {
                const tick = () => {
                    const now = getIranDate();
                    const today = now.toISOString().split('T')[0];
                    const start = new Date(state.planStartDateStr);
                    let diffDays = Math.ceil((now.getTime() - start.getTime()) / 86400000);
                    if (diffDays < 1) diffDays = 1;
                    
                    let cMonth = diffDays > 57 ? 3 : diffDays > 27 ? 2 : 1;
                    let cLabel = '', cText = '';
                    
                    const sorted = [...state.customEvents].sort((a,b) => new Date(a.date) - new Date(b.date));
                    const future = sorted.filter(e => new Date(e.date) >= now);
                    if(future.length > 0) {
                        cLabel = future[0].title;
                        const tDiff = new Date(future[0].date).getTime() - now.getTime();
                        const dLeft = Math.floor(tDiff/86400000);
                        const hLeft = Math.floor((tDiff%86400000)/3600000);
                        const mLeft = Math.floor((tDiff%3600000)/60000);
                        cText = (dLeft===0 && hLeft===0) ? `${mLeft} دقیقه مانده!` : `${dLeft>0?dLeft+' روز و ':''}${hLeft} ساعت`;
                    }
                    setPlanStatus({ currentWeek: Math.ceil(diffDays/7), currentMonth: cMonth, dayOfPlan: diffDays, countdownLabel: cLabel, countdownText: cText });

                    if (state.lastLoginDate !== today) {
                        const newCompleted = {...state.completedTasks};
                        state.quests.daily.forEach(q => delete newCompleted[`daily_${q.id}_${state.lastLoginDate}`]);
                        setState(prev => ({...prev, lastLoginDate: today, completedTasks: newCompleted, dailyNote: '', streak: state.lastLoginDate ? prev.streak + 1 : 1 }));
                    }
                };
                tick();
                const interval = setInterval(tick, 60000);
                return () => clearInterval(interval);
            }, [state.lastLoginDate, state.planStartDateStr, state.customEvents]);

            // Handlers
            const toggleTask = (id, reward, type, recurring) => {
                if (isEditMode) return;
                const today = new Date().toISOString().split('T')[0];
                const key = recurring ? `${type}_${id}_${today}` : `${type}_${id}`;
                const isDone = state.completedTasks[key];
                setState(prev => {
                    const newTasks = {...prev.completedTasks};
                    if(isDone) { delete newTasks[key]; return {...prev, completedTasks: newTasks, xp: Math.max(0, prev.xp - reward)}; }
                    else { newTasks[key] = true; return {...prev, completedTasks: newTasks, xp: prev.xp + reward, xpHistory: [...prev.xpHistory, {date: today, amount: reward}]}; }
                });
            };

            const handleSaveQuest = () => {
                if(!newQuestData.text) return alert("عنوان؟");
                const newQ = {...state.quests};
                const item = { id: `${newQuestType}_${Date.now()}`, text: newQuestData.text, xp: parseInt(newQuestData.xp)||50, type: 'custom', time: 'شناور', desc: newQuestData.desc||'...' };
                if(newQuestType==='daily') newQ.daily.push(item); else if(newQuestType==='weekly') newQ.weekly.push(item); else newQ.monthly[currentMonthView].push(item);
                setState(prev => ({...prev, quests: newQ})); setShowAddModal(false);
            };

            const getWeeklyStats = () => {
                const days = []; const today = new Date();
                for(let i=6; i>=0; i--) {
                    const d = new Date(today); d.setDate(today.getDate()-i);
                    const ds = d.toISOString().split('T')[0];
                    const val = state.xpHistory.filter(h=>h.date===ds).reduce((s,x)=>s+x.amount,0);
                    days.push({label: new Intl.DateTimeFormat('fa-IR',{weekday:'short'}).format(d), val});
                }
                return days;
            };

            if(loading) return React.createElement("div", {className: "min-h-screen bg-gray-900 flex items-center justify-center text-white"}, "در حال بارگذاری...");

            return React.createElement("div", { className: "min-h-screen pb-24" },
                // Header
                React.createElement("div", { className: "bg-gray-800 shadow-xl sticky top-0 z-20 border-b border-gray-700 p-4" },
                    React.createElement("div", { className: "max-w-3xl mx-auto" },
                        React.createElement("div", { className: "flex justify-between items-start mb-4" },
                            React.createElement("div", null,
                                React.createElement("div", { className: "text-sm font-bold text-gray-300 flex items-center gap-2" }, React.createElement(Calendar, {className:"w-4 h-4 text-indigo-400"}), " ", getShamsiDate()),
                                React.createElement("div", { className: "text-[10px] text-gray-500 mt-1" }, `فاز ${planStatus.currentMonth} | روز ${planStatus.dayOfPlan}`)
                            ),
                            React.createElement("div", { className: "flex gap-2" },
                                React.createElement("div", { title: "وضعیت سینک", className: "p-2" }, syncStatus==='syncing'?React.createElement(RefreshCw,{className:"w-5 h-5 animate-spin text-yellow-500"}):syncStatus==='success'?React.createElement(Cloud,{className:"w-5 h-5 text-green-500"}):React.createElement(CloudOff,{className:"w-5 h-5 text-gray-500"})),
                                React.createElement("button", { onClick: ()=>setShowTimer(true), className: "p-2 rounded-lg bg-gray-700 hover:bg-gray-600" }, React.createElement(Timer, {className:"w-5 h-5"})),
                                React.createElement("button", { onClick: ()=>setIsEditMode(!isEditMode), className: `p-2 rounded-lg ${isEditMode?'bg-yellow-500 text-black':'bg-gray-700'}` }, React.createElement(Edit3, {className:"w-5 h-5"})),
                                React.createElement("button", { onClick: ()=>setShowSettings(true), className: "p-2 rounded-lg bg-gray-700 hover:bg-gray-600" }, React.createElement(Settings, {className:"w-5 h-5"}))
                            )
                        ),
                        // Level Bar
                        React.createElement("div", { className: "flex items-center gap-4" },
                            React.createElement("div", { className: "w-12 h-12 bg-indigo-600 rounded-xl flex items-center justify-center font-black text-xl border-2 border-indigo-400" }, state.level),
                            React.createElement("div", { className: "flex-1" },
                                React.createElement("div", { className: "flex justify-between text-xs mb-1" }, React.createElement("span", {className:"text-indigo-200"}, `سطح ${state.level}`), React.createElement("span", null, `${state.xp} / ${LEVEL_THRESHOLDS[state.level] || 'MAX'} XP`)),
                                React.createElement("div", { className: "w-full h-3 bg-gray-900 rounded-full overflow-hidden border border-gray-700" }, React.createElement("div", { style: { width: `${Math.min(100, (state.xp / (LEVEL_THRESHOLDS[state.level]||10000))*100)}%` }, className: "h-full bg-indigo-500 rounded-full transition-all" }))
                            )
                        ),
                        // Countdown
                        planStatus.countdownLabel && React.createElement("div", { className: `mt-4 border rounded-lg p-3 flex justify-between text-sm ${planStatus.countdownText.includes('دقیقه')?'bg-red-900/20 border-red-500 text-red-200 animate-pulse':'bg-yellow-900/20 border-yellow-500 text-yellow-200'}` },
                            React.createElement("div", { className: "flex gap-2 font-bold" }, React.createElement(Flag, {className:"w-5 h-5"}), ` ${planStatus.countdownLabel}:`),
                            React.createElement("span", { className: "font-mono text-lg" }, planStatus.countdownText)
                        )
                    )
                ),
                
                // Modals
                showTimer && React.createElement(FocusTimer, { onClose: ()=>setShowTimer(false) }),
                selectedQuestInfo && React.createElement("div", { className: "fixed inset-0 bg-black/90 z-50 flex items-center justify-center p-4", onClick: ()=>setSelectedQuestInfo(null) }, 
                    React.createElement("div", { className: "bg-gray-800 p-6 rounded-2xl max-w-sm" },
                        React.createElement("h3", { className: "text-xl font-bold text-indigo-400 mb-4" }, selectedQuestInfo.text),
                        React.createElement("p", { className: "text-gray-300 text-sm leading-relaxed" }, selectedQuestInfo.desc),
                        React.createElement("button", { className: "mt-6 w-full bg-indigo-600 py-2 rounded", onClick: ()=>setSelectedQuestInfo(null) }, "بستن")
                    )

                    React.createElement("div", { className: "bg-gray-800 rounded-2xl w-full max-w-md p-6 border border-gray-700 max-h-[90vh] overflow-y-auto" },

                        React.createElement("div", { className: "mb-6 border-b border-gray-700 pb-4" },

                            React.createElement("input", { type: "date", className: "w-full bg-gray-900 border border-gray-700 rounded p-2 text-white", value: state.planStartDateStr.split('T')[0], onChange: (e)=>setState(p=>({...p, planStartDateStr:`${e.target.value}T00:00:00`})) })
                        ),
                        
                        React.createElement("div", { className: "mb-6 border-b border-gray-700 pb-4" },
                            React.createElement("label", { className: "text-sm text-gray-300 font-bold mb-3 block" }, "رویدادهای مهم"),
                            state.customEvents.map(e => React.createElement("div", { key: e.id, className: "flex justify-between items-center bg-gray-900 p-2 rounded border border-gray-700 text-sm mb-2" },
                                React.createElement("div", null, React.createElement("div", {className:"text-white"}, e.title), React.createElement("div", {className:"text-xs text-gray-500"}, formatEventDate(e.date))),
